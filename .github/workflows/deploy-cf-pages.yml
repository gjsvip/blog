name: Deploy Blog to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: 部署博客到 Cloudflare Pages（345 账号）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gjsvip-blog --branch=main

      - name: Summary
        run: |
          {
            echo "### 博客已部署 :books:"
            echo ""
            echo "- 自定义域名：https://blog.520691.xyz"
            echo "- GitHub Pages 镜像：https://gjsvip.github.io/blog/"
          } >> $GITHUB_STEP_SUMMARY

  # GitHub Pages / Gitee Pages 镜像源：干净 checkout，只含仓库文件（无 node_modules）
  update-gh-pages:
    name: Update gh-pages branch (Gitee Pages 国内镜像源)
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: gh-pages ${{ github.sha }}"
