name: Deploy Blog to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许推送 gh-pages 分支（Gitee Pages 国内镜像源）

jobs:
  deploy:
    name: 部署博客到 Cloudflare Pages（345 账号）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gjsvip-blog --branch=main

      - name: Update gh-pages branch (Gitee Pages 国内镜像源)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Summary
        run: |
          {
            echo "### 博客已部署 :books:"
            echo ""
            echo "- 自定义域名：https://blog.520691.xyz"
            echo "- GitHub Pages 镜像：https://gjsvip.github.io/blog/"
            echo "- Gitee Pages 镜像：https://dujie_nb_admin.gitee.io/blog/（需在 Gitee 网页端开启 Pages 服务）"
          } >> $GITHUB_STEP_SUMMARY
