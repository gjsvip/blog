# 渡劫小站提交后自动镜像到 Gitee（数据互通：GitHub 为主仓库，Gitee 自动同步）
#
# 配置方法（仓库 Settings > Secrets and variables > Actions）：
#   GITEE_USER   = Gitee 用户名（dujie_nb_admin）
#   GITEE_TOKEN  = Gitee 个人访问令牌（勾选 projects 权限）
# 未配置以上 Secret 时本工作流的镜像步骤自动跳过（不报失败）。
name: mirror-to-gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages (deploy job 可能刚生成，最多等待 2 分钟)
        run: |
          for i in $(seq 1 12); do
            if git fetch origin '+refs/heads/gh-pages:refs/remotes/origin/gh-pages' 2>/dev/null; then
              echo "gh-pages 已就绪"; exit 0
            fi
            echo "等待 gh-pages 生成… ($i/12)"; sleep 10
          done
          echo "gh-pages 等待超时，跳过"

      - name: Mirror to Gitee
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_USER / GITEE_TOKEN，跳过 Gitee 镜像（配置后自动生效）"
            exit 0
          fi
          git remote remove origin || true
          git remote add gitee "https://$GITEE_USER:$GITEE_TOKEN@gitee.com/$GITEE_USER/blog.git"
          git push --force gitee main:main
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git push --force gitee origin/gh-pages:gh-pages
          else
            echo "仓库无 gh-pages 分支，跳过"
          fi
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
